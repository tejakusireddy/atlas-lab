[project]
name = "atlas-lab"
version = "0.1.0"
description = "Reproducible reaction optimization and laboratory protocol simulation"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = ["atlas-domain", "atlas-science", "atlas-optimization"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
atlas-domain = { workspace = true }
atlas-science = { workspace = true }
atlas-optimization = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15", "pytest>=8", "hypothesis>=6", "pre-commit>=4", "pip-audit>=2.9"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires external services", "scientific: scientific integrity checks"]

[[tool.mypy.overrides]]
module = ["rdkit.*", "sklearn.*", "catboost.*", "scipy.*", "matplotlib.*", "joblib.*"]
ignore_missing_imports = true
