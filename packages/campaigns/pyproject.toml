[project]
name = "atlas-campaigns"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = ["atlas-domain", "pydantic>=2.11,<3", "psycopg[binary]>=3.2"]

[project.scripts]
atlas-migrate = "atlas_campaigns.database:main"

[tool.uv.sources]
atlas-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_campaigns"]
