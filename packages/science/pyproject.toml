[project]
name = "atlas-science"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = ["atlas-domain", "pydantic>=2.11,<3", "rdkit>=2025.3"]

[project.scripts]
atlas-import = "atlas_science.importer:main"

[tool.uv.sources]
atlas-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_science"]
