[project]
name = "atlas-instrument-gateway"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = ["atlas-domain", "pydantic>=2.11,<3"]

[project.scripts]
atlas-simulate = "atlas_instrument_gateway.simulator:main"

[tool.uv.sources]
atlas-domain = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_instrument_gateway"]
