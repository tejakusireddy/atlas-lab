[project]
name = "atlas-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "atlas-campaigns",
    "atlas-science",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15.1,<3",
]

[project.scripts]
atlas-api = "atlas_api.main:serve"
atlas-register = "atlas_api.register:main"

[tool.uv.sources]
atlas-campaigns = { workspace = true }
atlas-science = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]
